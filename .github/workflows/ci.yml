name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Show toolchain
        run: |
          node --version
          pnpm --version

      - name: Lint
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Seeded corpus fixture benchmark
        run: |
          pnpm cli corpus --out "$RUNNER_TEMP/station-corpus"
          pnpm cli benchmark --dataset "$RUNNER_TEMP/station-corpus/dataset.json" --runtime fixture --repeats 1 --execute --out "$RUNNER_TEMP/station-bench"

      - name: Build
        run: pnpm build

      - name: Security audit
        run: pnpm audit --audit-level=high
