<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-label="Benchmark exploration, precision, and recall">
  <rect width="100%" height="100%" fill="#f6f6f8"/>
  <text x="24" y="32" font-size="16" font-family="system-ui, sans-serif">Seeded corpus · exploration and quality</text>
  <text x="24" y="52" font-size="11" fill="#6e6e73" font-family="system-ui, sans-serif">Tall bar: median exploration bytes. Small bars: precision then recall. Fixture reviewer, not a model-quality claim.</text>
  <line x1="70" y1="250" x2="348" y2="250" stroke="#d2d2d7"/>
  
      <g transform="translate(90,0)">
        <rect x="0" y="70" width="36" height="180" fill="#6e6e73" opacity="0.9"/>
        <rect x="42" y="70" width="16" height="180" fill="#6e6e73" opacity="0.45"/>
        <rect x="62" y="70" width="16" height="180" fill="#6e6e73" opacity="0.25"/>
        <text x="36" y="272" text-anchor="middle" font-size="12">baseline</text>
        <text x="36" y="288" text-anchor="middle" font-size="11" fill="#6e6e73">100% exploration</text>
      </g>

      <g transform="translate(176,0)">
        <rect x="0" y="134" width="36" height="116.00000000000001" fill="#0071e3" opacity="0.9"/>
        <rect x="42" y="70" width="16" height="180" fill="#0071e3" opacity="0.45"/>
        <rect x="62" y="70" width="16" height="180" fill="#0071e3" opacity="0.25"/>
        <text x="36" y="272" text-anchor="middle" font-size="12">context</text>
        <text x="36" y="288" text-anchor="middle" font-size="11" fill="#6e6e73">64% exploration</text>
      </g>

      <g transform="translate(262,0)">
        <rect x="0" y="134" width="36" height="116.00000000000001" fill="#1f8a38" opacity="0.9"/>
        <rect x="42" y="70" width="16" height="180" fill="#1f8a38" opacity="0.45"/>
        <rect x="62" y="70" width="16" height="180" fill="#1f8a38" opacity="0.25"/>
        <text x="36" y="272" text-anchor="middle" font-size="12">packs</text>
        <text x="36" y="288" text-anchor="middle" font-size="11" fill="#6e6e73">64% exploration</text>
      </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#6e6e73">
    <rect x="24" y="300" width="12" height="12" fill="#0071e3"/>
    <text x="42" y="310">exploration</text>
    <rect x="140" y="300" width="12" height="12" fill="#0071e3" opacity="0.45"/>
    <text x="158" y="310">precision</text>
    <rect x="240" y="300" width="12" height="12" fill="#0071e3" opacity="0.25"/>
    <text x="258" y="310">recall</text>
  </g>
</svg>
